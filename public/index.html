<!DOCTYPE html>
<html lang="ja" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Desk Monitor | サポートデスク稼働状況</title>
  <meta name="description" content="サポートデスクの稼働状況をリアルタイムで可視化するWebアプリケーション">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
</head>

<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="app-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
        </svg>
        <span>Support Desk Monitor</span>
      </div>

      <nav class="app-nav">
        <button class="nav-btn active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9" />
            <rect x="14" y="3" width="7" height="5" />
            <rect x="14" y="12" width="7" height="9" />
            <rect x="3" y="16" width="7" height="5" />
          </svg>
          <span>ダッシュボード</span>
        </button>
        <button class="nav-btn" data-view="stats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" />
          </svg>
          <span>統計レポート</span>
        </button>
        <button class="nav-btn" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          <span>設定</span>
        </button>
      </nav>

      <div class="header-controls">
        <button class="theme-toggle" id="themeToggle" title="テーマ切替">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg class="moon-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Dashboard View -->
      <div id="dashboardView" class="view active">
        <div id="deskGrid" class="desk-grid">
          <!-- Desk cards will be dynamically generated -->
        </div>
      </div>

      <!-- Stats View -->
      <div id="statsView" class="view">
        <div class="stats-container">
          <div class="stats-header">
            <h1 class="stats-title">統計レポート</h1>
            <div class="stats-controls">
              <select class="stats-period-select" id="statsPeriod">
                <option value="today">今日</option>
                <option value="week">今週</option>
                <option value="month">今月</option>
              </select>
              <button class="btn" id="exportCsv">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="7,10 12,15 17,10" />
                  <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                CSV出力
              </button>
            </div>
          </div>

          <div class="stats-overview" id="statsOverview">
            <!-- Stats cards will be dynamically generated -->
          </div>

          <div class="stats-table-wrapper">
            <table class="stats-table">
              <thead>
                <tr>
                  <th>オペレーター</th>
                  <th>通話回数</th>
                  <th>通話時間</th>
                  <th>平均通話時間</th>
                  <th>受付可時間</th>
                  <th>後処理時間</th>
                  <th>休憩時間</th>
                </tr>
              </thead>
              <tbody id="statsTableBody">
                <!-- Stats rows will be dynamically generated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Settings View -->
      <div id="settingsView" class="view">
        <div class="settings-container">
          <!-- Display Settings -->
          <section class="settings-section">
            <h2 class="settings-section-title">表示設定</h2>
            <div class="setting-row">
              <div>
                <div class="setting-label">上下反転</div>
                <div class="setting-description">デスク配置を上下入れ替え（この端末のみに適用）</div>
              </div>
              <label class="toggle-switch">
                <input type="checkbox" id="flipVertical">
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="setting-row">
              <div>
                <div class="setting-label">左右反転</div>
                <div class="setting-description">デスク配置を左右入れ替え（この端末のみに適用）</div>
              </div>
              <label class="toggle-switch">
                <input type="checkbox" id="flipHorizontal">
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="setting-row">
              <div>
                <div class="setting-label">デスクトップ通知</div>
                <div class="setting-description">メモ更新時にデスクトップ通知を表示</div>
              </div>
              <label class="toggle-switch">
                <input type="checkbox" id="enableNotifications" checked>
                <span class="toggle-slider"></span>
              </label>
            </div>
          </section>

          <!-- Status Settings -->
          <section class="settings-section">
            <h2 class="settings-section-title">ステータス設定</h2>
            <div class="status-list" id="statusList">
              <!-- Status items will be dynamically generated -->
            </div>
            <button class="btn btn-secondary add-status-btn" id="addStatusBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              ステータスを追加
            </button>
          </section>

          <!-- Operator Assignment -->
          <section class="settings-section">
            <h2 class="settings-section-title">担当者割り当て</h2>
            <div id="operatorAssignment">
              <!-- Operator assignment will be dynamically generated -->
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- Memo History Modal -->
  <div class="modal-overlay" id="memoHistoryModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">メモ履歴</h3>
        <button class="modal-close" id="closeMemoHistory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="memo-history-list" id="memoHistoryList">
        <!-- Memo history items will be dynamically generated -->
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/memo.js"></script>
  <script src="js/desk.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
